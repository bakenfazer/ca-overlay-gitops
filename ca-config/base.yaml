# ca-config/base.yaml
#
# Shared baseline that is applied via the workflow to everying repo in this org.
#
# This file is deep-merged with ca-config/overlays/<repo>.yaml in the GitHub
# workflow, and the merged result is what gets applied. Because Custom Assembly
# `apply` is a full replace (declarative, not additive), the merged file is
# always the complete desired state for the repo — re-running is idempotent and
# nothing ever gets clobbered by a partial apply.
#
# The certificate below is an example self-signed CA for illustration only.
# Replace it with your organization's real internal root CA (PEM-encoded).

